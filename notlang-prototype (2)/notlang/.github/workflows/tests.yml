name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m mizan run examples/partner_total.json --db examples/db.json --arg pid=1 --grant db.read
      - name: Offline benchmark dry run
        run: python -m bench.run_bench --mock
      - name: Quality gate (our own rules, on the showcase programs)
        run: |
          python -m mizan gate examples/reserve_stock.json --db examples/shop_db.json
          python -m mizan gate examples/reserve_or_fallback.json --db examples/shop_db.json
